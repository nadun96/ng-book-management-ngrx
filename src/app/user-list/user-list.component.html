<section class="user-list">
    <header class="user-list__header">
        <h2>User Profiles</h2>
        <button type="button" (click)="reload()">Reload</button>
    </header>

    <p class="user-list__status" *ngIf="loading$ | async">Loading users...</p>
    <p class="user-list__error" *ngIf="(error$ | async) as error">Failed to load users: {{ error }}</p>

    <ng-container *ngIf="(users$ | async) as users">
        <p class="user-list__empty" *ngIf="!users.length && !(loading$ | async)">
            No users available.
        </p>

        <table *ngIf="users.length" class="user-table">
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Role</th>
                    <th scope="col">Last Login</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users; trackBy: trackById">
                    <td>{{ user.displayName }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.role }}</td>
                    <td>{{ user.lastLogin ? (user.lastLogin | date:'medium') : 'Never' }}</td>
                </tr>
            </tbody>
        </table>
    </ng-container>
</section>
